name: Native kernel guest trial

on: pull_request

permissions:
  contents: read

jobs:
  qemu:
    name: Kernel event and coldplug in KVM
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify native KVM is available
        run: |
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
      - name: Run the existing guest harness
        run: |
          docker run --rm --platform linux/amd64 \
            --device /dev/kvm \
            --volume "$PWD:/work" --workdir /work \
            --env "BUILDER_UID=$(id -u)" --env "BUILDER_GID=$(id -g)" \
            --env CARGO_BUILD_JOBS=2 \
            --env 'RUSTFLAGS=-Clinker=mold -Clinker-flavor=ld' \
            --entrypoint /bin/sh \
            ghcr.io/joshuarli/musl-toolchain@sha256:80f0ffb39c786eb6242b7b0345ddce3c6106c687c401d1fc0ea2ca69cf61c314 -ec '
              apk add --no-cache e2fsprogs=1.47.4-r0 qemu-system-x86_64=11.0.3-r0
              qemu-system-x86_64 --version
              addgroup -g "$BUILDER_GID" builder
              adduser -D -u "$BUILDER_UID" -G builder builder
              kvm_gid=$(stat -c %g /dev/kvm)
              kvm_group=$(awk -F: -v gid="$kvm_gid" "\$3 == gid {print \$1; exit}" /etc/group)
              if [ -z "$kvm_group" ]; then
                addgroup -g "$kvm_gid" kvm
                kvm_group=kvm
              fi
              addgroup builder "$kvm_group"
              mv /root/.cargo /root/.rustup /home/builder/
              chown -R builder:builder /home/builder
              su -s /bin/sh builder -c "
                export CARGO_HOME=/home/builder/.cargo RUSTUP_HOME=/home/builder/.rustup
                export PATH=\$CARGO_HOME/bin:\$PATH
                sh tools/check-qemu.sh
              "
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: native-kernel-guest-logs
          path: |
            .work/qemu-mdevd-prepare.log
            .work/qemu-mdevd-console.log
            .work/qemu-mdevd.log
