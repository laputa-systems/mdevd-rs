name: Native libudev-zero consumer trial

on: pull_request

permissions:
  contents: read

jobs:
  consumer:
    name: Multicast and libudev-zero in private namespaces
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify namespace and toolchain prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -U -n -r true
          rustup show active-toolchain
          mkdir -p .work/tmp
      - name: Run the existing consumer harness
        run: |
          export TMPDIR="$PWD/.work/tmp"
          sh tools/check-udev-consumer.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: native-consumer-logs
          path: |
            .work/tmp/live-mcast.log
            .work/tmp/live-consumer.log
